# Server Configuration
server.port=${PORT:8080}
server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Google OAuth 2.0 Configuration (populated from environment variables or .env)
google.oauth.client-id=${GOOGLE_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:}
google.oauth.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}

# Gemini API Configuration
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}

# Logging
logging.level.com.nebula.mail=INFO
logging.level.org.springframework.web=INFO
